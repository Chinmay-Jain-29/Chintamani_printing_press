<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1e293b"/>
      <stop offset="1" stopColor="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stopColor="#f59e0b"/>
      <stop offset="0.5" stopColor="#d97706"/>
      <stop offset="1" stopColor="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="120" y="70" width="560" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas textured background -->
  <rect width="800" height="500" fill="#f4efe4"/>
  <rect x="0" y="0" width="800" height="500" fill="url(#bg)" opacity="0.04"/>

  <!-- Luxury Velvet Visiting Card Mockup -->
  <g filter="url(#shadow)">
    <rect x="150" y="90" width="500" height="300" rx="16" fill="url(#bg)"/>
    <rect x="150" y="90" width="500" height="300" rx="16" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Gold Foil Geometric Accents -->
    <line x1="180" y1="120" x2="220" y2="120" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="185" cy="155" r="15" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M180 155L185 150L190 155L185 160Z" fill="url(#gold)"/>

    <!-- Business Details -->
    <text x="215" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">PRAKASH D. JAIN</text>
    <text x="215" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="url(#gold)" letter-spacing="3">NEW CHINTAMANI PRINTING PRESS</text>

    <!-- Services list -->
    <line x1="180" y1="210" x2="620" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <text x="180" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">Offset • Digital • Flex Printing • Wedding Cards</text>
    <text x="180" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">📍 Shrikant Talkies Road, Bus Stand, Dongaon</text>
    <text x="180" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">📞 +91 94213 96905 / 98348 53851</text>

    <!-- Badge -->
    <rect x="530" y="325" width="90" height="28" rx="14" fill="#c25e2e" fill-opacity="0.2" stroke="#c25e2e"/>
    <text x="548" y="343" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f97316">ESTD 1999</text>
  </g>
</svg>
