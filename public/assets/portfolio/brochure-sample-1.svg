<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="brochureShadow" x="120" y="60" width="560" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="8" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4efe4"/>

  <g filter="url(#brochureShadow)">
    <!-- Trifold Left Panel -->
    <path d="M150 90H290L290 410H150Z" fill="#1e293b"/>
    <!-- Center Panel -->
    <path d="M290 90H450L450 410H290Z" fill="#0f172a"/>
    <!-- Right Panel -->
    <path d="M450 90H590L590 410H450Z" fill="#1e293b"/>

    <!-- Fold Shadows -->
    <line x1="290" y1="90" x2="290" y2="410" stroke="#000000" stroke-width="4" stroke-opacity="0.4"/>
    <line x1="450" y1="90" x2="450" y2="410" stroke="#000000" stroke-width="4" stroke-opacity="0.4"/>

    <!-- Brochure Graphics -->
    <rect x="315" y="120" width="110" height="4" fill="#c25e2e"/>
    <text x="370" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AGRO TECH</text>
    <text x="370" y="180" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">आधुनिक शेती साधने</text>

    <!-- Content Blocks -->
    <rect x="310" y="210" width="120" height="70" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="370" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">Drip Irrigation</text>
    <text x="370" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">&amp; Solar Systems</text>

    <text x="370" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Mehekar • Buldhana</text>
    <text x="370" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c25e2e" text-anchor="middle">Printed by: New Chintamani Press</text>
  </g>
</svg>
